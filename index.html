<script>
// 由 404.html 跳返嚟時，將 /Expenses/?/<slug> 還原做乾淨網址 /Expenses/<slug>
(function(l){
  if (l.search[1] === '/'){
    var decoded = l.search.slice(1).split('&').map(function(s){ return s.replace(/~and~/g, '&'); }).join('?');
    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
  }
}(window.location));
</script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-soft:#dbeafe; --pos:#16a34a; --neg:#dc2626; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181c; --card:#22262e; --text:#e7e9ee; --muted:#9aa1ac; --line:#333944;
      --accent:#60a5fa; --accent-soft:#1e3a5f; --pos:#4ade80; --neg:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  /* 手動切換：[data-theme] 特異度高過 media query，一定贏 */
  :root[data-theme="dark"]{ --bg:#16181c; --card:#22262e; --text:#e7e9ee; --muted:#9aa1ac; --line:#333944;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --pos:#4ade80; --neg:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4); }
  :root[data-theme="light"]{ --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-soft:#dbeafe; --pos:#16a34a; --neg:#dc2626; --shadow:0 1px 3px rgba(0,0,0,.08); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.5; }
  .wrap{ max-width:640px; margin:0 auto; padding:16px 16px 96px; }
  h1{ font-size:20px; margin:4px 0 12px; display:flex; align-items:center; gap:8px; }
  h1 .refresh{ margin-left:auto; font-size:14px; font-weight:400; background:none; border:1px solid var(--line);
    color:var(--muted); padding:6px 10px; border-radius:8px; }
  h1 .net{ font-size:12px; font-weight:500; color:var(--accent); background:var(--accent-soft);
    padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  label{ display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  label:first-child{ margin-top:0; }
  input,select,textarea,button{ font:inherit; color:inherit; }
  input,select,textarea{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg); }
  input[type=number]{ -moz-appearance:textfield; }
  .btn{ background:var(--accent); color:#fff; border:none; padding:13px; border-radius:11px; width:100%;
    font-weight:600; font-size:16px; margin-top:16px; }
  .btn.sec{ background:var(--accent-soft); color:var(--accent); }
  .btn.ghost{ background:none; border:1px solid var(--line); color:var(--muted); margin-top:0; padding:8px 12px; width:auto; font-size:14px; font-weight:500; }
  .tripsel{ display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .tripsel select{ flex:1; font-weight:600; }
  .tripsel .btn.ghost{ white-space:nowrap; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--line);
    border-radius:20px; background:var(--bg); font-size:14px; user-select:none; }
  .chip.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .row{ display:flex; gap:10px; }
  .row>*{ flex:1; }
  .exp{ display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .exp:last-child{ border-bottom:none; }
  .exp .amt{ margin-left:auto; font-weight:700; white-space:nowrap; }
  .exp .meta{ font-size:13px; color:var(--muted); }
  .cat{ font-size:12px; background:var(--accent-soft); color:var(--accent); padding:2px 8px; border-radius:6px; }
  .acts{ display:flex; gap:8px; margin-top:6px; }
  .acts button{ background:none; border:none; color:var(--muted); font-size:13px; padding:0; text-decoration:underline; }
  .net{ display:flex; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .net:last-child{ border-bottom:none; }
  .net b{ margin-left:auto; }
  .pos{ color:var(--pos); } .neg{ color:var(--neg); }
  .pay{ display:flex; align-items:center; gap:8px; padding:14px; background:var(--accent-soft); border-radius:12px; margin-bottom:10px; }
  .pay .big{ font-weight:700; font-size:18px; margin-left:auto; }
  .fam{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .fam:last-child{ border-bottom:none; }
  .fam .name{ flex:1; }
  .muted{ color:var(--muted); font-size:14px; }
  .empty{ text-align:center; color:var(--muted); padding:32px 0; }
  nav{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); }
  nav button{ flex:1; background:none; border:none; padding:10px 0; color:var(--muted); font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav button.on{ color:var(--accent); }
  nav .ic{ font-size:20px; }
  .banner{ background:#fef3c7; color:#92400e; padding:12px 14px; border-radius:10px; font-size:14px; margin-bottom:12px; }
  @media (prefers-color-scheme: dark){ .banner{ background:#3a2f16; color:#fbbf24; } }
  .toast{ position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(16px); background:#111827; color:#fff;
    padding:10px 18px; border-radius:22px; font-size:14px; opacity:0; pointer-events:none; transition:.22s; z-index:50; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-color-scheme: dark){ .toast{ background:#e7e9ee; color:#16181c; } }

<body>
<div class="wrap">
  <h1><span id="title">旅行分帳</span><span id="net" class="net" style="display:none"></span>
    <button class="refresh" id="themeBtn" onclick="toggleTheme()" style="margin-left:auto" aria-label="切換光暗">🌙</button>
    <button class="refresh" onclick="load()">↻ 刷新</button></h1>

  <div id="view"><div class="empty">載入中…</div></div>
</div>

<nav>
  <button data-tab="add" class="on" onclick="go('add')"><span class="ic">➕</span>入數</button>

  <button data-tab="settle" onclick="go('settle')"><span class="ic">💰</span>結算</button>
  <button data-tab="stats" onclick="go('stats')"><span class="ic">📊</span>統計</button>
  <button data-tab="settings" onclick="go('settings')"><span class="ic">⚙️</span>設定</button>

<script src="settlement.js"></script>
<script>
// ⚠️ 部署後把下面換成你嘅 Apps Script Web App URL（見 SETUP.md）
const API_URL = "https://script.google.com/macros/s/AKfycbwsezHwBhz9QWMi5NVfsMkBLwiSbbXgFQVb-iRmXHk_uxAaXvhj8FK-PePaklAUFXmeyg/exec";

const PINNED = [['USD','美金'],['CNY','人民幣'],['HKD','港幣'],['JPY','日元'],['TWD','台幣'],['EUR','歐羅'],['GBP','英鎊'],['CHF','瑞士法郎']];
const ALL = [['AED','UAE Dirham'],['AUD','Australian Dollar'],['CAD','Canadian Dollar'],
  ['IDR','Indonesian Rupiah'],['INR','Indian Rupee'],['KRW','South Korean Won'],
  ['MOP','Macanese Pataca'],['MYR','Malaysian Ringgit'],['NZD','New Zealand Dollar'],['PHP','Philippine Peso'],
  ['SGD','Singapore Dollar'],['THB','Thai Baht'],['VND','Vietnamese Dong'],['BRL','Brazilian Real'],
  ['CZK','Czech Koruna'],['DKK','Danish Krone'],['EGP','Egyptian Pound'],['HUF','Hungarian Forint'],
  ['ILS','Israeli Shekel'],['ISK','Icelandic Krona'],['MXN','Mexican Peso'],['NOK','Norwegian Krone'],
  ['PLN','Polish Zloty'],['RUB','Russian Ruble'],['SAR','Saudi Riyal'],['SEK','Swedish Krona'],
  ['TRY','Turkish Lira'],['ZAR','South African Rand'],['LKR','Sri Lankan Rupee'],['NPR','Nepalese Rupee'],
  ['KHR','Cambodian Riel'],['LAK','Lao Kip'],['MMK','Myanmar Kyat'],['BND','Brunei Dollar'],['MNT','Mongolian Tugrik']];
const SYMBOL = {USD:'$',CNY:'¥',HKD:'HK$',JPY:'¥',TWD:'NT$',KRW:'₩',EUR:'€',GBP:'£',AUD:'A$',CAD:'C$',
  SGD:'S$',THB:'฿',MYR:'RM',PHP:'₱',VND:'₫',INR:'₹',NZD:'NZ$',MOP:'MOP$',IDR:'Rp',CHF:'CHF '};
const ZERO_DEC = new Set(['JPY','TWD','KRW','VND','HUF','CLP','ISK','MMK','LAK','KHR','IDR','MNT']);

let state = { config:{}, families:[], trips:[], expenses:[] };
let currentTab = 'add';
let currentTrip = '';          // trip id，由網址 slug 決定；'' = landing，'__notfound__' = 搵唔到
let newTripMode = false;
let editingId = null;
let filters = { fam:'', cat:'' };

// ---- 網址路由（每個 trip 一條專屬 link）----
const BASE = '/Expenses/';
function urlSlug(){ const m = location.pathname.match(/\/Expenses\/([^\/?#]+)/); return m ? decodeURIComponent(m[1]) : ''; }
function tripUrl(slug){ return location.origin + BASE + encodeURIComponent(slug); }
let lockedSlug = urlSlug();

// ---- 通用資料層（配合通用 Code.gs） ----
async function api(action, payload){
  if (action === 'bootstrap'){
    const r = await fetch(API_URL + '?action=bootstrap');
    return await r.json();
  }
  const r = await fetch(API_URL, { method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, payload)) });
  return await r.json();
}
// 唔即刻送，淨係整個描述出嚟入隊（所以離線都入到數）
function apiAppend(sheet, values){ return {action:'append', payload:{sheet, values}}; }
function apiUpdate(sheet, id, values, idField){ return {action:'update', payload:{sheet, id, values, idField: idField||'id'}}; }

// ---- 離線佇列：寫入排隊、有網先送；未送完之前唔准用伺服器資料蓋走本機 ----
let queue = [];
try{ queue = JSON.parse(localStorage.getItem('queue') || '[]'); }catch(e){ queue = []; }
let flushing = false, refreshing = false, toastTimer = null;
let writeSeq = 0;   // 每次寫入 +1；bootstrap 前後對唔上就代表期間有新改動，唔好覆蓋
function saveQueue(){ try{ localStorage.setItem('queue', JSON.stringify(queue)); return true; }catch(e){ return false; } }
function bgWrite(op){
  writeSeq++; queue.push(op);
  // 存唔到 = 關咗個 app 就冇咗，一定要話畀用戶知（storage 滿／私隱模式）
  if (!saveQueue()) alert('⚠️ 呢部機存唔到離線資料（儲存空間滿咗，或者用緊私隱瀏覽）。\n呢筆嘢一關 app 就會冇咗，請連返網之後再入一次。');
  renderNet(); flush();
}
async function flush(){
  if (flushing || !queue.length) return;
  flushing = true;
  let r;
  try{ r = await flushQueue(queue, api); }
  finally{ flushing = false; saveQueue(); renderNet(); }
  if (r && r.rejected){ alert('有一筆寫入被伺服器拒絕：' + r.rejected + '\n已同步返最新資料。'); load(); }
}
function renderNet(){
  const el = document.getElementById('net'); if (!el) return;
  if (queue.length) el.textContent = (navigator.onLine ? '⏳ ' : '📴 ') + queue.length + ' 筆待上傳';
  else el.textContent = navigator.onLine ? '' : '📴 離線';
  el.style.display = el.textContent ? '' : 'none';
}
function saveCache(){ try{ localStorage.setItem('cache', JSON.stringify(state)); }catch(e){} }
// 背景靜默重新載入（唔阻 UI；有未上傳嘅嘢時跳過，避免蓋走本機改動）
async function refresh(){
  if (queue.length || refreshing) return;
  refreshing = true;
  try{
    const seq = writeSeq;
    const res = await api('bootstrap');
    // 等緊回應嗰陣如果有新寫入，唔好用舊嘅伺服器資料蓋走佢
    if (res.ok && seq === writeSeq){ state = fromSheets(res.data.sheets||{}); resolveTrip(); render(); }
  }
  catch(e){}
  finally{ refreshing = false; }
}
function toast(msg, actionLabel, actionFn){
  const el = document.getElementById('toast');
  el.innerHTML = esc(msg) + (actionLabel ? ` <button style="margin-left:10px;background:none;border:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer">${esc(actionLabel)}</button>` : '');
  if (actionLabel){ el.querySelector('button').onclick = ()=>{ el.classList.remove('show'); actionFn(); }; }
  el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), actionLabel ? 4500 : 1600);
}

function truthy(v){ return v === true || String(v).toUpperCase() === 'TRUE'; }
function parseShares(v){ try{ return v ? JSON.parse(v) : {}; }catch(_){ return {}; } }
function fromSheets(sh){
  const cfg = {};
  (sh.Config||[]).forEach(r=>{ if(r.key!==undefined && r.key!=='') cfg[String(r.key)] = (r.value==null?'':String(r.value)); });
  return {
    config: cfg,
    families: (sh.Families||[]).map(f=>({ id:String(f.id), name:String(f.name==null?'':f.name),
      active: !(f.active === false || String(f.active).toUpperCase() === 'FALSE'), trip:String(f.trip||'') })),
    trips: (sh.Trips||[]).map(t=>({ id:String(t.id), name:String(t.name==null?'':t.name),
      currency:String(t.currency||''), archived: truthy(t.archived), deleted: truthy(t.deleted), slug:String(t.slug||'') })),
    expenses: (sh.Expenses||[]).map(e=>({ id:String(e.id), date:String(e.date||''), category:String(e.category||''),
      payer:String(e.payer||''), amount:Number(e.amount)||0,
      participants:String(e.participants||'').split(',').filter(Boolean),
      note:String(e.note==null?'':e.note), createdAt:String(e.createdAt||''),
      deleted: truthy(e.deleted), trip:String(e.trip||''),
      currency:String(e.currency||''), rate:Number(e.rate)||1,
      splitMode:(String(e.splitMode||'')==='custom')?'custom':'family', shares:parseShares(e.shares),
      by:String(e.by||'') }))
  };
}

async function load(){
  if (API_URL.indexOf('PASTE_YOUR') === 0){ render(); return; }
  // 1. 本機快取即刻上畫（冷啟動唔使等、冇網都睇到）
  let cached = false;
  try{
    const c = localStorage.getItem('cache');
    if (c){ state = JSON.parse(c); cached = true; resolveTrip(); render(); }
  }catch(e){}
  // 2. 先清晒未上傳嘅，先至攞伺服器資料，唔會蓋走本機
  await flush();
  if (queue.length){ if (cached) toast('📴 離線 · 顯示緊本機資料'); renderNet(); return; }
  try{
    const seq = writeSeq;
    const res = await api('bootstrap');
    if (!res.ok) throw res.error;
    // 同 refresh() 一樣：等回應期間入咗新嘢就唔好蓋走（下次 refresh 自然接返）
    if (seq !== writeSeq){ render(); return; }
    state = fromSheets(res.data.sheets || {});
  }catch(e){
    if (cached) toast('📴 離線 · 顯示緊本機資料');
    else alert('載入失敗：' + e);
    resolveTrip(); render(); return;
  }
  resolveTrip();
  render();
}

// ---- helpers ----
function trips(){ return (state.trips || []).filter(t=>!t.deleted); }
function currentTripObj(){ return trips().find(t=>t.id===currentTrip); }
function tripCurrency(){ const t=currentTripObj(); return t ? t.currency : ''; }
function tripExpenses(){ return (state.expenses||[]).filter(e=>e.trip===currentTrip); }
function resolveTrip(){
  if (lockedSlug){
    const t = (state.trips||[]).find(x=>!x.deleted && ((x.slug||'')===lockedSlug || x.id===lockedSlug));
    currentTrip = t ? t.id : '__notfound__';
    if (t) rememberTrip(t);
  } else {
    currentTrip = '';
  }
}
function recentTrips(){ try{ return JSON.parse(localStorage.getItem('recentTrips')||'[]'); }catch(e){ return []; } }
function rememberTrip(t){
  const key = t.slug || t.id;
  const list = recentTrips().filter(x=>x.slug!==key);
  list.unshift({slug:key, name:t.name});
  localStorage.setItem('recentTrips', JSON.stringify(list.slice(0,12)));
}
function tripFamilies(){ return state.families.filter(f=>f.trip===currentTrip); }
function activeFamilies(){ return tripFamilies().filter(f=>f.active); }
function famName(id){ const f = state.families.find(x=>x.id===id); return f ? f.name : id; }
function categories(){ return (state.config.categories||'其他').split(',').map(s=>s.trim()).filter(Boolean); }
function todayStr(){ const d=new Date(); const l=new Date(d.getTime()-d.getTimezoneOffset()*60000); return l.toISOString().slice(0,10); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function symbolOf(c){ return SYMBOL[c] || (c ? c+' ' : '$'); }
function fmtC(n, cur){ const d=ZERO_DEC.has(cur)?0:2; return symbolOf(cur)+Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmt(n){ return fmtC(n, tripCurrency()); }
function round4(n){ return Math.round(n*10000)/10000; }
function baseAmt(e){ return e.amount * (e.rate || 1); }
async function fetchRate(from, to){
  if (from === to) return 1;
  try{ const r = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(from)}`);
    const j = await r.json(); return (j && j.rates && j.rates[to]) ? j.rates[to] : null; }
  catch(e){ return null; }
}
function myFamily(){ return localStorage.getItem('myFamily:'+currentTrip) || ''; }
// 光暗主題
function currentTheme(){ const t=localStorage.getItem('hub-theme'); if(t) return t; return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
function applyTheme(){ const t=localStorage.getItem('hub-theme'); const r=document.documentElement; if(t) r.setAttribute('data-theme',t); else r.removeAttribute('data-theme'); const b=document.getElementById('themeBtn'); if(b) b.textContent = currentTheme()==='dark'?'☀️':'🌙'; }
function toggleTheme(){ localStorage.setItem('hub-theme', currentTheme()==='dark'?'light':'dark'); applyTheme(); }
function currencyOptions(sel){
  const inList = PINNED.concat(ALL).some(x=>x[0]===sel);
  return `${sel && !inList ? `<option value="${esc(sel)}" selected>${esc(sel)}</option>`:''}
    <optgroup label="常用">${PINNED.map(([k,n])=>`<option value="${k}" ${sel===k?'selected':''}>${k} ${n}</option>`).join('')}</optgroup>
    <optgroup label="全部">${ALL.map(([k,n])=>`<option value="${k}" ${sel===k?'selected':''}>${k} — ${n}</option>`).join('')}</optgroup>`;
}

function go(tab){
  currentTab = tab; editingId = null; newTripMode = false;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  render();                                       // 即時（用快取，唔等網路）
  if (tab==='list' || tab==='settle' || tab==='stats') refresh();  // 背景攞最新
}

// ---- trip bar（每個 trip 一條專屬網址，冇「所有 trip」清單）----
function createFormHtml(title, cancelable){
  return `<div class="card">
    <label>${title}</label>
    <input type="text" id="nt-name" placeholder="例：高雄 trip 2026">
    <label>連結名（英文/數字，會變成你嘅專屬網址 /Expenses/…）</label>
    <input type="text" id="nt-slug" placeholder="例：Kaohsiung2026">
    <label>貨幣（呢個 trip 用）</label>
    <select id="nt-curr"><option value="" disabled selected>揀貨幣…</option>${currencyOptions('')}</select>
    <div class="row" style="margin-top:12px">
      <button class="btn" style="margin-top:0" onclick="createTrip()">建立</button>
      ${cancelable ? `<button class="btn ghost" style="margin-top:0;flex:0 0 auto" onclick="cancelNewTrip()">取消</button>`:''}
    </div>
  </div>`;
}
function recentTripsHtml(){
  const r = recentTrips();
  if (!r.length) return '';
  return `<div class="card">
    <label>你喺呢部手機開過嘅 trip（淨係你部機記住，唔會畀人睇到）</label>
    ${r.map(x=>`<div class="fam"><span class="name">${esc(x.name)}</span><button class="btn ghost" onclick="openTrip('${esc(x.slug)}')">開</button></div>`).join('')}
  </div>`;
}
function renderTripBar(){
  const el = document.getElementById('tripbar');
  if (API_URL.indexOf('PASTE_YOUR') === 0){ el.innerHTML=''; return; }
  if (currentTrip === '__notfound__'){
    el.innerHTML = `<div class="banner">搵唔到呢個 trip（連結可能唔啱或者已刪除）。</div>` + createFormHtml('或者建立一個新 trip', false) + recentTripsHtml();
    return;
  }
  if (!currentTrip){ // landing（base 網址）
    el.innerHTML = createFormHtml('建立一個 trip（會有一條專屬 link 畀你 share）', false) + recentTripsHtml();
    return;
  }
  const t = currentTripObj();
  el.innerHTML = `
    <div class="tripsel">
      <div style="flex:1;font-weight:600;font-size:17px">${esc(t.name)}${t.archived?'（已封存）':''}</div>
      <button class="btn ghost" onclick="shareTrip()">🔗 分享</button>
      <button class="btn ghost" onclick="showNewTrip()">＋</button>
    </div>
    ${newTripMode ? createFormHtml('新 trip', true) : ''}`;
}
function openTrip(slug){
  lockedSlug = slug; newTripMode = false; currentTab = 'add';
  history.pushState(null,'', tripUrl(slug));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab==='add'));
  resolveTrip(); render();
}
function showNewTrip(){ newTripMode=true; renderTripBar(); }
function cancelNewTrip(){ newTripMode=false; renderTripBar(); }
function shareTrip(){
  const t=currentTripObj(); if(!t) return; const url=tripUrl(t.slug||t.id);
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>toast('已複製 link ✓'), ()=>prompt('複製呢條 link：', url)); }
  else prompt('複製呢條 link：', url);
}
function createTrip(){
  const name = document.getElementById('nt-name').value.trim();
  let slug = document.getElementById('nt-slug').value.trim().replace(/[^A-Za-z0-9_-]/g,'');
  const currency = document.getElementById('nt-curr').value;
  if (!name){ alert('請輸入 trip 名'); return; }
  if (!slug){ alert('請輸入連結名（英文/數字，例：Kaohsiung2026）'); return; }
  if (!currency){ alert('請揀貨幣'); return; }
  if ((state.trips||[]).some(t=>!t.deleted && (t.slug||'')===slug)){ alert('呢個連結名已經有人用咗，換過一個'); return; }
  const id = 't' + Date.now();
  state.trips.push({id, name, currency, slug, archived:false, deleted:false});
  currentTrip = id; lockedSlug = slug; newTripMode=false;
  history.pushState(null,'', tripUrl(slug));
  render();
  bgWrite(apiAppend('Trips', {id, name, currency, slug, archived:'FALSE'}));
  toast('已建立 ' + name + ' ✓');
}

// ---- render ----
function render(){
  saveCache(); renderNet();
  renderTripBar();
  const v = document.getElementById('view');
  if (API_URL.indexOf('PASTE_YOUR') === 0){
    v.innerHTML = `<div class="banner">未設定 API：請跟 <b>SETUP.md</b> 部署 Apps Script，再把 <code>index.html</code> 頂部嘅 <code>API_URL</code> 換成你嘅 Web App URL。</div>`;
    return;
  }
  if (!currentTripObj()){ v.innerHTML = ''; return; }  // landing / 搵唔到：tripbar 已處理
  ({add:renderAdd, list:renderList, settle:renderSettle, stats:renderStats, settings:renderSettings}[currentTab])(v);
}

function renderAdd(v){

  const editing = editingId ? state.expenses.find(e=>e.id===editingId) : null;
  const cats = categories();
  const fams = activeFamilies();
  const sel = editing ? editing.payer : (myFamily() || (fams[0]&&fams[0].id) || '');
  const parts = editing ? editing.participants : fams.map(f=>f.id);
  const base = tripCurrency();
  const ecur = editing ? (editing.currency||base) : base;
  const erate = editing ? (editing.rate||1) : 1;
  const showFx = ecur !== base;
  const esplit = editing ? (editing.splitMode||'family') : 'family';
  const initParts = parts;
  const initShares = editing && editing.shares ? editing.shares : {};
  v.innerHTML = `
    <div class="card">
      ${fams.length ? '' : `<div class="banner">未有家庭 — 去 ⚙️設定 新增家庭先可以入數。</div>`}
      ${editing ? `<div class="muted" style="margin-bottom:8px">✏️ 修改開支 <button class="btn ghost" onclick="editingId=null;render()">取消</button></div>` : ''}
      <label>日期</label>
      <input type="date" id="f-date" value="${editing ? editing.date : todayStr()}">
      <label>類別</label>
      <select id="f-cat">${cats.map(c=>`<option ${editing&&editing.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <label>邊個俾錢</label>
      <select id="f-payer">${fams.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
      <label>金額</label>
      <div class="row">
        <input type="number" id="f-amt" inputmode="decimal" step="0.01" min="0" placeholder="0" value="${editing?editing.amount:''}" oninput="updateConv()" style="flex:2">
        <select id="f-cur" onchange="onCurChange()" style="flex:1.3">${currencyOptions(ecur)}</select>
      </div>
      <div id="f-fx" style="display:${showFx?'block':'none'};margin-top:10px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="muted" id="f-fxlabel">匯率　1 ${esc(ecur)} =</span>
          <input type="number" id="f-rate" step="0.0001" value="${showFx?erate:''}" oninput="updateConv()" style="width:120px;padding:6px 8px">
          <span class="muted" id="f-fxbase">${esc(base)}</span>
        </div>
        <div class="muted" id="f-conv" style="margin-top:6px"></div>
        <div class="muted" id="f-fxinfo" style="margin-top:2px"></div>
      </div>
      <label>分法</label>
      <select id="f-split" onchange="onSplitChange()">
        <option value="family" ${esplit==='family'?'selected':''}>按家庭平分</option>
        <option value="custom" ${esplit==='custom'?'selected':''}>自訂金額（逐家填實數，例如住宿房價唔同）</option>
      </select>
      <div id="f-split-area"></div>
      <label>備註（可留空）</label>
      <input type="text" id="f-note" value="${editing?esc(editing.note):''}" placeholder="例：民宿兩晚">
      <button class="btn" onclick="submitExpense()">${editing?'更新':'記低'}</button>
    </div>`;
  renderSplitArea({parts: initParts, shares: initShares});
  updateConv();
}

// 依分法渲染「參與/自訂金額」區；init={parts,shares} 只喺初次用
function renderSplitArea(init){
  const area = document.getElementById('f-split-area');
  const mode = document.getElementById('f-split').value;
  const fams = activeFamilies();
  const amtEl = document.getElementById('f-amt');
  if (mode === 'custom'){
    amtEl.setAttribute('readonly',''); amtEl.style.opacity = '.6';
    const vals = (init && init.shares) ? Object.assign({}, init.shares) : {};
    if (!init){ area.querySelectorAll('.cshare').forEach(i=>{ if(i.value) vals[i.dataset.fam]=i.value; }); }
    area.innerHTML = `<label style="margin-top:6px">逐家填實際金額（留空 = 嗰家冇份）</label>` +
      fams.map(f=>`<div class="row" style="align-items:center;gap:8px;margin-bottom:6px">
        <span style="flex:1">${esc(f.name)}</span>
        <input type="number" class="cshare" data-fam="${f.id}" inputmode="decimal" step="0.01" min="0" placeholder="0" value="${vals[f.id]!==undefined?vals[f.id]:''}" style="flex:1" oninput="updateCustomTotal()">
      </div>`).join('') +
      `<div class="muted" id="f-custom-total" style="margin-top:4px"></div>`;
    updateCustomTotal();
  } else {
    amtEl.removeAttribute('readonly'); amtEl.style.opacity = '1';
    const parts = (init && init.parts) ? init.parts : fams.map(f=>f.id);
    area.innerHTML = `<label style="margin-top:6px">邊幾家有份分（點揀）</label>
      <div class="chips" id="f-parts">
        ${fams.map(f=>`<span class="chip ${parts.includes(f.id)?'on':''}" data-id="${f.id}" onclick="this.classList.toggle('on')">${esc(f.name)}</span>`).join('')}
      </div>`;
  }
}
function onSplitChange(){ renderSplitArea(null); }
function updateCustomTotal(){
  let sum = 0; document.querySelectorAll('.cshare').forEach(i=>{ sum += parseFloat(i.value)||0; });
  sum = round2(sum);
  const amtEl = document.getElementById('f-amt'); if (amtEl) amtEl.value = sum ? sum : '';
  const cur = (document.getElementById('f-cur')||{}).value || tripCurrency();
  const t = document.getElementById('f-custom-total'); if (t) t.textContent = '合計：' + fmtC(sum, cur);
  updateConv();
}

// 貨幣改動：攞匯率、更新換算預覽
async function onCurChange(){
  const cur = document.getElementById('f-cur').value;
  const base = tripCurrency();
  const fx = document.getElementById('f-fx');
  if (cur === base){ fx.style.display='none'; updateConv(); return; }
  fx.style.display='block';
  document.getElementById('f-fxlabel').textContent = `匯率　1 ${cur} =`;
  document.getElementById('f-fxbase').textContent = base;
  document.getElementById('f-fxinfo').textContent = '攞緊匯率…';
  document.getElementById('f-rate').value = '';
  const rate = await fetchRate(cur, base);
  document.getElementById('f-rate').value = rate ? round4(rate) : '';
  document.getElementById('f-fxinfo').textContent = rate ? '（自動匯率，可手動改）' : '⚠️ 攞唔到匯率，請自己填';
  updateConv();
}
function updateConv(){
  const curEl = document.getElementById('f-cur'); if (!curEl) return;
  const cur = curEl.value, base = tripCurrency();
  const conv = document.getElementById('f-conv');
  if (cur === base){ if (conv) conv.textContent = ''; return; }
  const amt = parseFloat(document.getElementById('f-amt').value)||0;
  const rate = parseFloat(document.getElementById('f-rate').value)||0;
  if (conv) conv.textContent = rate ? `≈ ${fmtC(amt*rate, base)}（用嚟結算）` : '';
}

async function submitExpense(){
  const date = document.getElementById('f-date').value;
  const category = document.getElementById('f-cat').value;
  const payer = document.getElementById('f-payer').value;
  const note = document.getElementById('f-note').value.trim();
  const splitMode = (document.getElementById('f-split')||{}).value || 'family';
  let participants, shares = {}, amount;
  if (splitMode === 'custom'){
    document.querySelectorAll('.cshare').forEach(i=>{ const v=parseFloat(i.value); if(v>0) shares[i.dataset.fam]=round2(v); });
    participants = Object.keys(shares);
    amount = round2(participants.reduce((s,p)=>s+shares[p], 0));
  } else {
    participants = [...document.querySelectorAll('#f-parts .chip.on')].map(c=>c.dataset.id);
    amount = parseFloat(document.getElementById('f-amt').value);
  }
  if (!currentTrip){ alert('請先揀一個 trip'); return; }
  if (!date || !payer){ alert('請填日期同俾錢家庭'); return; }
  if (!(amount>0)){ alert(splitMode==='custom' ? '自訂金額：最少要填一家金額' : '請填正確金額'); return; }
  if (!participants.length){ alert('至少要有一家有份'); return; }
  const base = tripCurrency();
  const currency = (document.getElementById('f-cur') || {}).value || base;
  let rate = 1;
  if (currency !== base){ rate = parseFloat(document.getElementById('f-rate').value); if (!(rate>0)){ alert('請填匯率（1 '+currency+' = ? '+base+'）'); return; } }
  const parts = participants.join(',');
  const sharesStr = JSON.stringify(shares);
  if (editingId){
    const e = state.expenses.find(x=>x.id===editingId);
    if (e) Object.assign(e, {date, category, payer, amount, participants:participants.slice(), note, trip:currentTrip, currency, rate, splitMode, shares});
    bgWrite(apiUpdate('Expenses', editingId, {date, category, payer, amount, participants:parts, note, trip:currentTrip, currency, rate, splitMode, shares:sharesStr}));
    editingId = null;
  } else {
    const dup = findDupe(state.expenses, {id:null, trip:currentTrip, date, category, amount, currency});
    if (dup && !confirm('似乎已經有一筆一樣嘅數：\n\n'
        + dup.date + ' · ' + dup.category + ' · ' + fmtC(dup.amount, dup.currency || base)
        + (dup.by ? '（' + famName(dup.by) + '入）' : '')
        + '\n\n係咪真係要再入多一筆？')) return;
    const id = 'e'+Date.now(), createdAt = new Date().toISOString(), by = myFamily();
    state.expenses.push({id, date, category, payer, amount, participants:participants.slice(), note, createdAt, deleted:false, trip:currentTrip, currency, rate, splitMode, shares, by});
    bgWrite(apiAppend('Expenses', {id, date, category, payer, amount, participants:parts, note, createdAt, deleted:'FALSE', trip:currentTrip, currency, rate, splitMode, shares:sharesStr, by}));
  }
  if (currentTab==='add') renderAdd(document.getElementById('view'));
  toast('已記低 ✓');
}

function editExpense(id){
  editingId=id; currentTab='add';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab==='add'));
  render();
  window.scrollTo(0,0);
}
function delExpense(id){
  if(!confirm('確定刪除呢筆數？')) return;
  const e = state.expenses.find(x=>x.id===id); if(e) e.deleted = true;
  render();
  bgWrite(apiUpdate('Expenses', id, {deleted:'TRUE'}));
  toast('已刪除', '撤銷', ()=>undoDelete(id));
}
function undoDelete(id){
  const e = state.expenses.find(x=>x.id===id); if(e) e.deleted = false;
  render();
  bgWrite(apiUpdate('Expenses', id, {deleted:'FALSE'}));
  toast('已還原 ✓');
}

  if (filters.cat) list = list.filter(e=>e.category===filters.cat);
  list.sort((a,b)=> (a.date<b.date?1:a.date>b.date?-1:(a.createdAt<b.createdAt?1:-1)));
  const total = list.reduce((s,e)=>s+baseAmt(e),0);
  const cats = categories();
  v.innerHTML = `
    <div class="card">
      <div class="row">
        <div><label>家庭</label>
          <select onchange="filters.fam=this.value;render()">
            <option value="">全部</option>
            ${tripFamilies().map(f=>`<option value="${f.id}" ${filters.fam===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}
          </select></div>
        <div><label>類別</label>
          <select onchange="filters.cat=this.value;render()">
            <option value="">全部</option>
            ${cats.map(c=>`<option ${filters.cat===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select></div>
      </div>
      <div class="muted" style="margin-top:10px">共 ${list.length} 筆 · 合計 ≈ ${fmt(total)}</div>
    </div>
    <div class="card">
      ${list.length ? list.map(e=>`
        <div class="exp">
          <div>
            <div><span class="cat">${esc(e.category)}</span> <b>${esc(famName(e.payer))}</b> 俾</div>
            <div class="meta">${e.date} · ${e.splitMode==='custom' ? '自訂 · '+e.participants.map(p=>esc(famName(p))+' '+fmtC((e.shares&&e.shares[p])||0, e.currency||tripCurrency())).join('、') : '分：'+e.participants.map(famName).map(esc).join('、')}${e.note?' · '+esc(e.note):''}${e.by?' · '+esc(famName(e.by))+'入':''}</div>
            <div class="acts"><button onclick="editExpense('${e.id}')">改</button><button onclick="delExpense('${e.id}')">刪</button></div>
          </div>
          <div class="amt">${fmtC(e.amount, e.currency||tripCurrency())}${(e.currency && e.currency!==tripCurrency()) ? `<div class="meta" style="text-align:right;font-weight:400;margin-top:2px">≈ ${fmt(baseAmt(e))}</div>` : ''}</div>
        </div>`).join('') : '<div class="empty">呢個 trip 未有開支</div>'}
    </div>`;
}

let hkdRate = {}; // 主貨幣 -> 每 1 單位等於幾多 HKD（null=攞緊，0=攞唔到）
async function ensureHkdRate(base){
  if (!base || base === 'HKD' || hkdRate[base] !== undefined) return;
  hkdRate[base] = null;
  const r = await fetchRate(base, 'HKD');
  hkdRate[base] = r || 0;
  if (currentTab === 'settle') render();
}
function renderSettle(v){
  const teRaw = tripExpenses();
  const te = teRaw.map(e=>{                    // 全部折合主貨幣先結算
    const m = { ...e, amount: baseAmt(e) };
    if (e.splitMode==='custom' && e.shares){ const r=e.rate||1; m.shares={}; for(const k in e.shares) m.shares[k]=Number(e.shares[k])*r; }
    return m;
  });
  const { nets, transfers } = settleDebts(te, tripFamilies());
  const involved = new Set();
  teRaw.filter(e=>!e.deleted).forEach(e=>{ involved.add(e.payer); (e.participants||[]).forEach(p=>involved.add(p)); });
  const fams = tripFamilies().filter(f=> involved.has(f.id) || Math.abs(nets[f.id]||0)>0.005);
  const base = tripCurrency();
  const showHkd = base && base !== 'HKD';
  if (showHkd) ensureHkdRate(base);
  const hr = hkdRate[base];
  const hkd = n => (showHkd && hr>0)
    ? `<div class="meta" style="text-align:right;font-weight:400;margin-top:2px">≈ ${fmtC(Math.abs(n)*hr,'HKD')}</div>`
    : (showHkd && hr===null ? `<div class="meta" style="text-align:right;margin-top:2px">港幣計緊…</div>` : '');
  const rateNote = showHkd
    ? `<div class="muted" style="margin-top:8px;font-size:12px">${hr>0?`今日匯率　1 ${esc(base)} ≈ ${round4(hr)} HKD`:(hr===null?'攞緊港幣匯率…':'⚠️ 攞唔到港幣匯率')}</div>`
    : '';
  v.innerHTML = `
    <div class="card">
      <div class="muted" style="margin-bottom:6px">每家淨額（以 ${esc(base)} 結算，正=應收返，負=要俾）</div>
      ${fams.length ? fams.map(f=>{ const n=nets[f.id]||0; const c=n>0?'pos':n<0?'neg':'';
        return `<div class="net">${esc(f.name)}<div style="margin-left:auto;text-align:right"><b class="${c}">${n>0?'+':''}${fmt(n)}</b>${hkd(n)}</div></div>`; }).join('') : '<div class="empty">未有開支</div>'}
      ${rateNote}
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">點樣過數（最少筆數）</div>
      ${transfers.length ? transfers.map(t=>`
        <div class="pay"><b>${esc(famName(t.from))}</b> 俾 <b>${esc(famName(t.to))}</b><div class="big" style="text-align:right">${fmt(t.amount)}${hkd(t.amount)}</div></div>
      `).join('') : '<div class="empty">大家啱數，唔使過數 🎉</div>'}
    </div>`;
}

function renderStats(v){
  const list = tripExpenses().filter(e=>!e.deleted);
  const base = tripCurrency();
  const fams = tripFamilies();
  const paid = {}, owed = {}, catTot = {}; let total = 0;
  fams.forEach(f=>{ paid[f.id]=0; owed[f.id]=0; });
  list.forEach(e=>{
    const amt = baseAmt(e); total += amt;
    catTot[e.category] = (catTot[e.category]||0) + amt;
    if (paid[e.payer]===undefined) paid[e.payer]=0;
    paid[e.payer] += amt;
    const parts = e.participants||[];
    if (e.splitMode==='custom' && e.shares){ const r=e.rate||1; parts.forEach(p=>{ if(owed[p]===undefined) owed[p]=0; owed[p] += (Number(e.shares[p])||0)*r; }); }
    else if (parts.length){ const sh=amt/parts.length; parts.forEach(p=>{ if(owed[p]===undefined) owed[p]=0; owed[p] += sh; }); }
  });
  const cats = Object.keys(catTot).sort((a,b)=>catTot[b]-catTot[a]);
  const maxCat = cats.length ? catTot[cats[0]] : 0;
  const showHkd2 = base && base!=='HKD';
  if (showHkd2) ensureHkdRate(base);
  const hr = hkdRate[base];
  const hk = n => (showHkd2 && hr>0) ? `　≈ ${fmtC(n*hr,'HKD')}` : '';
  v.innerHTML = `
    <div class="card">
      <div class="muted" style="margin-bottom:4px">總使費（${esc(base)}）</div>
      <div style="font-size:22px;font-weight:700">${fmt(total)}<span class="muted" style="font-size:14px;font-weight:400">${hk(total)}</span></div>
      <div class="muted" style="margin-top:2px">${list.length} 筆</div>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">每家：俾咗 / 應攤 / 淨</div>
      ${fams.filter(f=>paid[f.id]||owed[f.id]).map(f=>{ const n=round2(paid[f.id]-owed[f.id]); const c=n>0?'pos':n<0?'neg':'';
        return `<div class="net"><div style="flex:1">${esc(f.name)}<div class="muted" style="font-size:12px">俾咗 ${fmt(paid[f.id])} · 應攤 ${fmt(owed[f.id])}</div></div><b class="${c}">${n>0?'+':''}${fmt(n)}</b></div>`; }).join('') || '<div class="empty">未有開支</div>'}
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">類別分佈</div>
      ${cats.length ? cats.map(c=>`
        <div style="margin-bottom:8px">
          <div style="display:flex"><span style="flex:1">${esc(c)}</span><span class="muted">${fmt(catTot[c])}</span></div>
          <div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${maxCat?Math.round(catTot[c]/maxCat*100):0}%;background:var(--accent)"></div></div>
        </div>`).join('') : '<div class="empty">未有開支</div>'}
    </div>`;
}

function renderSettings(v){
  const t = currentTripObj();
  v.innerHTML = `
    <div class="card">
      <label>目前 trip</label>
      ${t ? `
        <input type="text" id="s-tripname" value="${esc(t.name)}">
        <button class="btn sec" onclick="saveTripName()">改 trip 名</button>
        <label>貨幣（呢個 trip）</label>
        <select onchange="setTripCurrency(this.value)">${currencyOptions(t.currency)}</select>
        <div class="muted" style="margin-top:6px">而家：${esc(t.currency||'未設定')} · 例 ${fmt(1234)}</div>
        <button class="btn ghost" style="margin-top:14px" onclick="toggleArchive()">${t.archived?'取消封存':'封存呢個 trip'}</button>
        <button class="btn ghost" style="margin-top:10px;color:var(--neg);border-color:var(--neg)" onclick="deleteTrip()">🗑 刪除呢個 trip</button>
      ` : `<div class="muted">未揀 trip — 喺頂部建立一個</div>`}
    </div>
    <div class="card">
      <label>我係邊家（呢個 trip、記喺呢部手機，入數時預設）</label>
      <select onchange="localStorage.setItem('myFamily:'+currentTrip, this.value)">
        <option value="">未揀</option>
        ${activeFamilies().map(f=>`<option value="${f.id}" ${myFamily()===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <label>類別（逗號分隔，全部 trip 共用）</label>
      <input type="text" id="s-cats" value="${esc(state.config.categories||'')}">
      <button class="btn sec" onclick="saveCats()">儲存類別</button>
    </div>
    <div class="card">
      <label>家庭（呢個 trip 專屬）</label>
      ${tripFamilies().length ? tripFamilies().map(f=>`
        <div class="fam">
          <span class="name ${f.active?'':'muted'}">${esc(f.name)}${f.active?'':'（已停用）'}</span>
          <button class="btn ghost" onclick="renameFam('${f.id}')">改名</button>
          <button class="btn ghost" onclick="toggleFam('${f.id}',${!f.active})">${f.active?'停用':'啟用'}</button>
        </div>`).join('') : '<div class="muted" style="margin-bottom:4px">未有家庭</div>'}
      <button class="btn sec" onclick="addFam()">＋ 新增家庭</button>
    </div>`;
}
function saveTripName(){ const n=document.getElementById('s-tripname').value.trim(); if(!n) return; const t=currentTripObj(); if(t) t.name=n; render(); bgWrite(apiUpdate('Trips', currentTrip, {name:n})); toast('已改名 ✓'); }
function setTripCurrency(c){ const t=currentTripObj(); if(t) t.currency=c; render(); bgWrite(apiUpdate('Trips', currentTrip, {currency:c})); toast('貨幣：'+c); }
function toggleArchive(){ const t=currentTripObj(); if(!t) return; t.archived=!t.archived; render(); bgWrite(apiUpdate('Trips', currentTrip, {archived: t.archived?'TRUE':'FALSE'})); }
function deleteTrip(){
  const t=currentTripObj(); if(!t) return;
  if(!confirm(`確定刪除「${t.name}」？呢個 trip 嘅開支同家庭會一齊隱藏。`)) return;
  const st=state.trips.find(x=>x.id===currentTrip); if(st) st.deleted=true;
  bgWrite(apiUpdate('Trips', currentTrip, {deleted:'TRUE'}));
  goLanding();
  toast('已刪除 trip');
}
// 返去 base 網址（landing，唔鎖任何 trip）
function goLanding(){ lockedSlug=''; newTripMode=false; history.pushState(null,'', location.origin + BASE); resolveTrip(); render(); }
function saveCats(){ const v=document.getElementById('s-cats').value; state.config.categories=v; render(); bgWrite(apiUpdate('Config', 'categories', {value:v}, 'key')); toast('已儲存類別 ✓'); }
function addFam(){ const n=prompt('新家庭名稱：'); if(!(n&&n.trim())) return; const id='f'+Date.now(); state.families.push({id, name:n.trim(), active:true, trip:currentTrip}); render(); bgWrite(apiAppend('Families', {id, name:n.trim(), active:'TRUE', trip:currentTrip})); toast('已加 '+n.trim()); }
function renameFam(id){ const n=prompt('改名：', famName(id)); if(!(n&&n.trim())) return; const f=state.families.find(x=>x.id===id); if(f) f.name=n.trim(); render(); bgWrite(apiUpdate('Families', id, {name:n.trim()})); }
function toggleFam(id, active){ const f=state.families.find(x=>x.id===id); if(f) f.active=active; render(); bgWrite(apiUpdate('Families', id, {active: active?'TRUE':'FALSE'})); }

window.addEventListener('focus', ()=>{ flush(); if(currentTab==='list'||currentTab==='settle'||currentTab==='stats') refresh(); });
window.addEventListener('online', ()=>{ renderNet(); flush(); });
window.addEventListener('offline', renderNet);
// Service Worker：net-first（有網一定攞最新、唔會卡舊版），冇網先用快取 → 離線都開得到個 app
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('popstate', ()=>{ lockedSlug = urlSlug(); newTripMode=false; resolveTrip(); render(); });
applyTheme();
load();
</script>
</body>
</html>
