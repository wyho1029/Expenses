<!doctype html>
<html><head><meta charset="utf-8"><title>旅行分帳</title>
<script>
// GitHub Pages SPA 技巧：將 /Expenses/<slug> 轉去 /Expenses/?/<slug>，再由 index.html 還原
(function(){
  var seg = 1; // 保留 /Expenses/
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
})();
</script>
</head><body></body></html>
